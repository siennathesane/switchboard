[workspace]
resolver = "3"
members = [
    "crates/switchboard-wire",
    "crates/switchboard-core",
    "crates/switchboard-store",
    "crates/switchboard-cluster",
    "crates/switchboard-server",
    "crates/switchboard",
    "crates/switchboard-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/switchboard"

[workspace.dependencies]
switchboard-wire = { path = "crates/switchboard-wire" }
switchboard-core = { path = "crates/switchboard-core" }
switchboard-store = { path = "crates/switchboard-store" }
switchboard-cluster = { path = "crates/switchboard-cluster" }
switchboard-server = { path = "crates/switchboard-server" }
switchboard-bench = { path = "crates/switchboard-bench" }

tokio = { version = "1.53", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
rocksdb = { version = "0.25", features = ["multi-threaded-cf"] }
libc = "0.2"
mimalloc = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
aws-lc-rs = "1"
rustls-pemfile = "2"
clap = { version = "4", features = ["derive", "env"] }
tokio-util = "0.7"
proptest = "1"
anyhow = "1"
serde_json = "1"
sha1 = "0.10"
base64 = "0.22"
mdns-sd = "0.11"
if-addrs = "0.13"
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
