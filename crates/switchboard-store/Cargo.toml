[package]
name = "switchboard-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RocksDB-backed KV store and OpenRaft log/state-machine storage"

[dependencies]
switchboard-core = { workspace = true }
serde_json = { workspace = true }
switchboard-wire = { workspace = true }
openraft = { workspace = true }
rocksdb = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# Backup archive integrity digests (already a workspace dependency).
sha1 = { workspace = true }

# Tests exercise the backup/restore round-trip through a real embedded
# broker (dev-dep cycle with switchboard-embedded is intentional and
# supported by cargo: it depends back on this crate only as a normal dep).
[dev-dependencies]
switchboard-embedded = { workspace = true }
switchboard-cluster = { workspace = true }
tracing-subscriber = { workspace = true }
