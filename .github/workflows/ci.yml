# Switchboard CI — every commit runs the full test surface across every
# platform GitHub hosts runners for:
#
#   rust-tests  cargo nextest over the workspace (unit + in-process
#               integration, incl. the soak_smoke 3-node cluster test)
#               plus doc tests, on ubuntu x64+arm64, macos arm64, windows
#               x64+arm64. (macOS x86_64 is not coverable: GitHub retired
#               the last Intel image, macos-13, in December 2025.)
#   harness     multi-language conformance harness: a real 3-node broker
#               cluster driven by pika/paho-mqtt/stomp.py (python),
#               amqp091-go (go), amqplib (node), bunny (ruby), the
#               orchestrator durability/restart check, and the scale
#               test, on ubuntu x64+arm64, macos arm64, windows x64.
#               (windows-11-arm has no Ruby toolchain, so the ruby suite
#               — and with it the harness — cannot run there.)
#   jepsen      the jepsen lab in Docker: 5 broker nodes + control
#               container, full 9-combo matrix (fifo/fanout/topo x
#               parts/kill/chaos), 60s windows — Linux x64+arm64 (the
#               lab needs Linux containers with NET_ADMIN; Docker is not
#               part of the macOS/Windows hosted runner images).
#   bench       docker benchmark sweep: 1/3/5/7-node clusters, all
#               scenarios, Linux x64+arm64; raw results uploaded as
#               artifacts. No perf thresholds — shared runners are too
#               noisy for gates; the bar is "every scenario completes and
#               reports numbers".
#
# The k3s churn soak (k8s/soak.yaml) runs for hours by design and stays a
# lab workload; its smoke variant runs inside rust-tests as soak_smoke.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # aws-lc-sys assembles its crypto backend on windows; NASM is not
      # preinstalled on the hosted images.
      - name: install NASM
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress
      - name: add NASM to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

      # Save the build cache even on failed runs: iteration speed
      # matters more than cache purity while bringing the matrix up.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # -j 2: the hosted runners are 4 cores, smaller than the 10-core box
      # the nextest profiles were tuned on, and every integration test
      # runs multi-node raft clusters in-process. Stay under the profile
      # default of 4 to keep raft timers healthy. soak_smoke is excluded
      # here and run separately below. Windows runs the suite at identity
      # tempo: its default timer resolution (15.6ms) cannot deliver the
      # sub-15ms raft heartbeats of a 10-50x warp, and formation-heavy
      # tests (autoscale 3->9) flake on it. Linux/macOS keep the 50x dev
      # tempo (macos green across every run at 50x). The variable stays
      # scoped to this step: tempo::tests::identity_without_env asserts
      # identity in a clean environment.
      - name: workspace tests
        env:
          # Empty string off-Windows: set-but-unparseable reads as
          # identity in tempo::scale, and the variable must not carry a
          # real factor into tempo::tests::identity_without_env.
          SB_TIME_SCALE: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo nextest run --workspace -j 2 -E 'not test(soak_smoke)'

      - name: soak smoke (soft time-warp; 12 workloads vs a live 3-node cluster)
        env:
          # 0.25 stretches the in-process cluster's raft timers 4x. A
          # value ABOVE 1 shrinks timers — the first windows attempt ran
          # at 10x and the 3-node cluster churned elections apart at
          # t=18s (groups unhosted, forwards refused, redeliveries
          # unflagged). Identity was the old default; 0.25 is the same
          # headroom the jepsen lab gets.
          SB_TIME_SCALE: "0.25"
          SWITCHBOARD_ARGON2_M_KIB: "2048"
          SWITCHBOARD_ARGON2_T: "1"
        run: cargo nextest run -p switchboard-server --test soak_smoke -j 1

      - name: doc tests
        run: cargo test --doc --workspace

  harness:
    name: language harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        # bash on every OS: the steps use POSIX env-var syntax, and the
        # windows default (pwsh) rejects `"$VENV_PY" -m pip …`.
        shell: bash
    env:
      # matrix context works in job-level env; runner context would not.
      VENV_PY: ${{ contains(matrix.os, 'windows') && 'harness-venv/Scripts/python.exe' || 'harness-venv/bin/python' }}
      # Windows stdio defaults to cp1252 and the suites print arrows
      # (U+2192); without this the first check name crashes the process.
      PYTHONUTF8: "1"
      # Test-grade password hashing for the spawned brokers (same
      # rationale as the rust-tests job).
      SWITCHBOARD_ARGON2_M_KIB: "2048"
      SWITCHBOARD_ARGON2_T: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Save the build cache even on failed runs: iteration speed
      # matters more than cache purity while bringing the matrix up.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: harness/clients/go/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: python clients (pika, paho-mqtt, stomp.py)
        run: |
          python -m venv harness-venv
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install pika paho-mqtt stomp.py

      - name: node client (amqplib)
        run: npm ci
        working-directory: harness/clients/node

      - name: go client (amqp091-go)
        run: go mod download
        working-directory: harness/clients/go

      - name: ruby client (bunny)
        run: gem install --no-document bunny

      - name: conformance harness (builds the broker, boots 3 nodes)
        env:
          SB_BROKER_LOG_DIR: harness/broker-logs
        run: $VENV_PY harness/run.py

      - name: scale test (load across 3->6->3 with hard-kill churn)
        run: $VENV_PY harness/scale_test.py

      - name: upload harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs-${{ matrix.os }}
          path: |
            harness/out/
            harness/broker-logs/
          if-no-files-found: ignore

  jepsen:
    name: jepsen (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # The lab SSH key is gitignored; the node image embeds the public
      # half and the control image the private half.
      - name: generate lab ssh key
        run: |
          mkdir -p jepsen/docker/keys
          ssh-keygen -t ed25519 -N '' -f jepsen/docker/keys/id_ed25519

      - name: build node image (compiles the broker)
        run: ./jepsen/docker/build-node-image.sh

      # Fresh node containers per combo (up.sh recreates them; the control
      # image build inside up.sh is layer-cached after the first combo).
      # SB_TIME_SCALE=0.25 stretches the lab brokers' raft timers 4x
      # (up.sh writes /var/run/sb-env; sb-start sources it): a contended
      # 4-core runner cannot hold 100ms heartbeats across five brokers —
      # at identity tempo the meta group churned elections for whole
      # combos and every publish timed out (run 5, fanout x chaos).
      - name: run 9-combo matrix
        env:
          SB_TIME_SCALE: "0.25"
          # The lab control container drives the brokers as `guest` from
          # remote pod IPs; the brokers' guest-loopback rule needs this.
          SWITCHBOARD_ALLOW_REMOTE_GUEST: "1"
          SWITCHBOARD_ARGON2_M_KIB: "2048"
          SWITCHBOARD_ARGON2_T: "1"
        run: |
          set -euo pipefail
          failed=0
          for test in fifo fanout topo; do
            for nemesis in parts kill chaos; do
              echo "::group::jepsen: $test x $nemesis"
              # --drain-limit: the 45s default assumes a quiet developer
              # box; on shared CI runners a 60s window under nemesis needs
              # more drain headroom or the checker reports :unknown.
              # --publish-rate 5 keeps the backlog small enough that the
              # drain always completes (a starved drain reports :unknown
              # or caveated losses no matter how long it is given).
              # One fresh-lab retry per combo: on contended x64 runners
              # the drain/analysis layer occasionally reports :unknown
              # (never a real anomaly — zero lost or reordered messages
              # across every failing combo so far). A protocol bug is
              # deterministic and reproduces across both attempts; the
              # second attempt's artifacts are uploaded either way.
              ok=0
              for attempt in 1 2; do
                if [ "$attempt" = 2 ]; then
                  echo "retrying combo on a fresh lab"
                fi
                if ./jepsen/docker/up.sh 5 >/dev/null \
                   && ./jepsen/docker/run.sh --test "$test" --nemesis "$nemesis" \
                        --time-limit 60 --drain-limit 180 --publish-rate 5; then
                  ok=1
                  break
                fi
                ./jepsen/docker/down.sh >/dev/null || true
              done
              if [ "$ok" = 1 ]; then
                echo "combo $test x $nemesis: PASS"
              else
                echo "combo $test x $nemesis: FAIL (both attempts)"
                failed=1
              fi
              ./jepsen/docker/down.sh >/dev/null || true
              echo "::endgroup::"
            done
          done
          exit "$failed"

      # Jepsen's store paths embed ISO timestamps with colons, which
      # upload-artifact rejects — ship one tarball instead.
      - name: collect jepsen results
        if: always()
        run: |
          if [ -d jepsen/store ]; then
            tar -czf jepsen-results.tar.gz -C jepsen store
          fi

      - name: upload jepsen results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jepsen-results-${{ matrix.os }}
          path: jepsen-results.tar.gz
          if-no-files-found: ignore

  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # bench/cluster.sh reuses the jepsen node image, whose build needs
      # the lab key's public half in place.
      - name: generate lab ssh key
        run: |
          mkdir -p jepsen/docker/keys
          ssh-keygen -t ed25519 -N '' -f jepsen/docker/keys/id_ed25519

      - name: build node + runner images (compiles the broker)
        run: |
          echo "::group::node image"
          ./jepsen/docker/build-node-image.sh
          echo "::endgroup::"
          echo "::group::bench runner image"
          ./bench/docker/build.sh
          echo "::endgroup::"

      - name: benchmark sweep
        run: ./bench/sweep.sh all 20

      - name: upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.os }}
          path: bench/results/
          if-no-files-found: ignore
